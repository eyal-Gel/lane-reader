<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EGG קורא">
  <title>EGG קורא המסלולים</title>
  <meta name="author" content="Eyal Gelberg (EGG)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>🎳 <span class="brand">EGG</span> קורא המסלולים <span id="playerTag" class="ptag"></span></h1>
    <div id="sessionInfo" class="sinfo"></div>
  </header>

  <main>
    <section id="view-play" class="view active"></section>
    <section id="view-read" class="view"></section>
    <section id="view-balls" class="view"></section>
    <section id="view-learn" class="view"></section>
    <section id="view-more" class="view"></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <nav class="tabs">
    <button data-view="play" class="active"><span>🎯</span>זריקה</button>
    <button data-view="read"><span>🧠</span>קריאה</button>
    <button data-view="balls"><span>🎱</span>ארסנל</button>
    <button data-view="learn"><span>📖</span>לימוד</button>
    <button data-view="more"><span>⚙️</span>עוד</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
